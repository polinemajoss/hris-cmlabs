version: '3.8' # Versi Docker Compose

services:
  # Layanan Database MySQL
  mysql:
    image: mysql:8.0 # Menggunakan image MySQL versi 8.0
    container_name: hris-mysql # Nama kontainer
    environment: # Variabel lingkungan untuk konfigurasi MySQL
      MYSQL_ROOT_PASSWORD: your_root_password # Ganti dengan password yang kuat!
      MYSQL_DATABASE: hris_db
      MYSQL_USER: hris_user
      MYSQL_PASSWORD: hris_password
    volumes:
      - mysql_data:/var/lib/mysql # Menyimpan data MySQL secara persisten
    ports:
      - "3306:3306" # Mengekspos port 3306 (HANYA untuk pengembangan/debugging lokal, hapus di produksi)
    networks:
      - hris_network # Menghubungkan ke jaringan kustom
    healthcheck: # Mengecek apakah database sudah siap
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Layanan Backend Laravel
  backend:
    build: # Membangun image dari Dockerfile.backend
      context: ../ # Konteks build (direktori utama proyek hris-cmlabs)
      dockerfile: docker/Dockerfile.backend
    container_name: hris-backend
    volumes:
      - ./backend:/var/www/html # Mounting kode untuk pengembangan, gunakan COPY di Dockerfile untuk produksi
    environment: # Variabel lingkungan Laravel
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080 # URL frontend Anda atau gateway API
      DB_CONNECTION: mysql
      DB_HOST: mysql # Nama layanan database di Docker Compose
      DB_PORT: 3306
      DB_DATABASE: hris_db
      DB_USERNAME: hris_user
      DB_PASSWORD: hris_password
      # Tambahkan variabel lingkungan Laravel lainnya sesuai kebutuhan Anda
    ports:
      - "9000:9000" # Mengekspos port PHP-FPM (biasanya untuk penggunaan internal oleh NGINX)
    networks:
      - hris_network
    depends_on: # Memastikan MySQL sudah sehat sebelum backend dimulai
      mysql:
        condition: service_healthy

  # Layanan NGINX (untuk melayani Next.js dan proxy ke Laravel)
  nginx:
    image: nginx:alpine # Menggunakan image NGINX Alpine
    container_name: hris-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Menyalin file konfigurasi NGINX
      - ./frontend/public:/var/www/frontend/public # Melayani file statis Next.js
    ports:
      - "8080:80" # Memetakan port host 8080 ke port kontainer 80 (tempat NGINX mendengarkan)
    networks:
      - hris_network
    depends_on: # Memastikan frontend dan backend siap
      - frontend
      - backend

  # Layanan Frontend Next.js
  frontend:
    build: # Membangun image dari Dockerfile.frontend
      context: ../
      dockerfile: docker/Dockerfile.frontend
    container_name: hris-frontend
    volumes:
      - ./frontend:/app # Mounting kode untuk pengembangan, gunakan COPY di Dockerfile untuk produksi
    environment: # Variabel lingkungan Next.js
      NEXT_PUBLIC_API_URL: http://localhost:8080/api # Sesuaikan dengan konfigurasi NGINX Anda
    ports:
      - "3000:3000" # Mengekspos port server Next.js (internal, NGINX akan mem-proxy)
    networks:
      - hris_network
    depends_on:
      - backend # Frontend mungkin membutuhkan backend untuk panggilan API saat build

volumes:
  mysql_data: {} # Definisi volume untuk data MySQL

networks:
  hris_network:
    driver: bridge # Jaringan kustom untuk kontainer Anda