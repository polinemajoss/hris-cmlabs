server {
    listen 80; # NGINX mendengarkan di port 80
    server_name localhost; # Atau nama domain Anda saat deploy

    # Melayani file statis Next.js (dari direktori public)
    root /var/www/frontend/public;
    index index.html index.htm;

    # Konfigurasi untuk rute Next.js
    location / {
        try_files $uri $uri/ /index.html; # Mencoba melayani file langsung atau fallback ke index.html
    }

    # Proxy permintaan API ke backend Laravel
    location /api/ {
        proxy_pass http://backend:9000; # 'backend' adalah nama layanan di docker-compose.yml, 9000 adalah port PHP-FPM
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Konfigurasi tambahan untuk file JS/CSS Next.js
    location ~ ^/(.*)\.js$ {
        add_header Content-Type application/javascript;
        try_files $uri $uri/ =404;
    }

    location ~ ^/(.*)\.css$ {
        add_header Content-Type text/css;
        try_files $uri $uri/ =404;
    }
}