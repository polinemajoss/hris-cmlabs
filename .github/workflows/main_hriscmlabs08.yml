# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - hriscmlabs08

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Ini diperlukan untuk actions/checkout

    steps:
      - uses: actions/checkout@v4 # Clone repositori ke runner

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x' # Menggunakan versi Node.js yang spesifik

      - name: npm install, build, and test
        # Perintah ini akan dijalankan di dalam direktori 'frontend'
        # Pastikan package.json Anda ada di dalam './frontend/package.json'
        working-directory: ./frontend # <--- SESUAIKAN JIKA FOLDER NEXT.JS ANDA BERBEDA
        run: |
          npm install # Menginstal semua dependensi
          npm run build --if-present # Menjalankan skrip build Next.js (hasilnya di ./.next)
          npm run test --if-present # Menjalankan skrip test (jika ada)

      - name: Prepare artifact for deployment
        # Langkah ini akan mengemas hasil build Next.js ke dalam file zip.
        # Secara default, Next.js menempatkan hasil build di folder ".next".
        # Kami akan menavigasi ke folder ".next" dan mengemas *kontennya*
        # sehingga saat di-deploy ke Azure, file-file aplikasi berada di root webapp.
        run: |
          # Navigasi ke direktori output build Next.js
          # Pastikan jalur ini benar sesuai dengan struktur proyek Anda
          cd frontend/.next # <--- SESUAIKAN JIKA OUTPUT BUILD ANDA BERBEDA (misal: frontend/out)
          
          # Mengemas semua konten dari direktori build (.next) ke dalam release.zip
          # File release.zip akan dibuat di root workspace runner
          zip -r ../../release.zip ./*

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app # Nama artifact yang akan diunggah
          path: release.zip # Path ke file zip yang telah dibuat

  deploy:
    runs-on: ubuntu-latest
    needs: build # Job ini akan dijalankan setelah job 'build' selesai
    environment:
      name: 'Production' # Mendefinisikan lingkungan deployment
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }} # Mengambil URL webapp dari output langkah deploy
    permissions:
      id-token: write # Diperlukan untuk otentikasi Azure
      contents: read # Diperlukan untuk actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app # Mendownload artifact yang telah diunggah oleh job 'build'

      - name: Unzip artifact for deployment
        # Mengekstrak file zip. Konten dari file zip (hasil build Next.js)
        # akan diekstrak langsung ke direktori kerja saat ini,
        # yang akan menjadi root deployment untuk Azure Web App.
        run: unzip release.zip
          
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2723E3C2AC6D4725A468F03D510709AF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_67AA12FE3D6E4FF1AB036F0A8760623C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC0DAEB1F9F8448DB8DE3AC8022E3687 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hriscmlabs08' # Nama Azure Web App Anda
          slot-name: 'Production' # Slot deployment (biasanya Production untuk main branch)
          package: . # Menyebarkan semua file di direktori saat ini (yang sudah di-unzip)
