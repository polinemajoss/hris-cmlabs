# .github/workflows/deploy.yml
name: Deploy to Azure VM

on:
  push:
    branches:
      - main # Workflow akan terpicu setiap push ke branch 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest # Runner yang akan menjalankan workflow ini

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Mengambil kode dari repositori GitHub

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18" # Pastikan versi Node.js sesuai dengan proyek Anda

      - name: Clean Next.js build cache on Runner
        run: |
          rm -rf frontend/.next # Menghapus cache build Next.js di runner GitHub Actions
          rm -rf frontend/out   # Menghapus folder 'out' jika menggunakan next export

      - name: Install Frontend Dependencies and Build
        run: |
          cd frontend # Pindah ke direktori frontend
          npm install
          npm run build # Membangun aplikasi Next.js (menghasilkan folder .next)

      - name: Stop Services on VM before SCP
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            echo "Stopping Nginx..."
            sudo systemctl stop nginx || true # Hentikan Nginx, '|| true' mencegah kegagalan workflow jika Nginx tidak berjalan
            echo "Stopping PM2 processes..."
            pm2 stop all || true # Hentikan semua proses PM2
            pm2 delete all || true # Hapus semua proses PM2 dari daftar
            pm2 save || true # Simpan konfigurasi PM2 yang bersih agar tidak auto-start yang salah

      - name: Transfer Frontend Build and Backend Code
        uses: appleboy/scp-action@v0.1.7 # Action GitHub untuk menyalin file
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "frontend/,backend/" # Menyalin seluruh folder frontend/ dan backend/ dari repo
          target: "/var/www/hris-cmlabs/" # Direktori root aplikasi di VM Azure
          overwrite: true # Menimpa file yang sudah ada di target
          rm: true # Menghapus isi folder target sebelum menyalin (untuk deployment yang bersih)
          debug: false # Ubah ke 'true' jika Anda ingin melihat log SCP yang lebih detail

      - name: Run Backend Migrations and Restart Services
        uses: appleboy/ssh-action@v1.0.0 # Action GitHub untuk menjalankan perintah SSH di VM
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            echo "Starting backend deployment..."
            # === BAGIAN BACKEND (LARAVEL) ===
            cd /var/www/hris-cmlabs/backend # Pindah ke direktori backend

            echo "Installing backend dependencies..."
            composer install --no-dev --optimize-autoloader

            echo "Running database migrations..."
            php artisan migrate --force

            echo "Clearing backend cache..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # === BAGIAN FRONTEND (NEXT.JS) ===
            cd /var/www/hris-cmlabs/frontend # Pindah ke direktori frontend

            echo "Starting Next.js application with PM2..."
            # Memulai aplikasi Next.js menggunakan PM2 dengan nama 'hris-nextjs'
            pm2 start npm --name hris-nextjs -- start
            pm2 save # Simpan status PM2 agar aplikasi otomatis berjalan setelah reboot VM

            # === RESTART WEB SERVER ===
            echo "Reloading Nginx..."
            sudo systemctl reload nginx # Me-reload Nginx untuk menerapkan konfigurasi terbaru (jika ada) dan proxy ke aplikasi yang sudah berjalan