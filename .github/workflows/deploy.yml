# .github/workflows/deploy.yml
name: Deploy ke Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Siapkan Direktori SSH dan Known Hosts
        run: |
          mkdir -p ~/.ssh # Membuat direktori ~/.ssh jika belum ada
          chmod 700 ~/.ssh # Mengatur izin agar hanya pemilik yang bisa membaca/menulis/menjalankan

      - name: Tambahkan Host Key VM ke known_hosts
        run: |
          # Menambahkan host key VM ke known_hosts. Ini mencegah Host key verification failed.
          ssh-keyscan -H ${{ secrets.AZURE_VM_HOST }} >> ~/.ssh/known_hosts
          # Mengatur izin agar hanya pemilik yang bisa membaca/menulis known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Bersihkan Cache Build Frontend di Runner
        run: |
          rm -rf frontend/.next
          rm -rf frontend/out

      - name: Instal Dependensi Frontend dan Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sinkronkan Kode ke VM Menggunakan Rsync
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            # Pastikan rsync terinstal di VM
            if ! command -v rsync &> /dev/null
            then
                echo "rsync tidak ditemukan, menginstal..."
                sudo apt update && sudo apt install -y rsync
            fi

            # Hentikan layanan yang mungkin mengunci file sebelum sinkronisasi
            echo "Menghentikan Nginx sebelum rsync..."
            sudo systemctl stop nginx || true
            echo "Menghentikan proses PM2 sebelum rsync..."
            pm2 stop all || true
            pm2 delete all || true
            pm2 save || true

            # Pastikan direktori target ada dan memiliki izin yang benar
            sudo mkdir -p /var/www/hris-cmlabs/frontend
            sudo mkdir -p /var/www/hris-cmlabs/backend/public
            sudo chown -R ${{ secrets.AZURE_VM_USER }}:www-data /var/www/hris-cmlabs/
            sudo chmod -R 775 /var/www/hris-cmlabs/

            # Rsync untuk frontend: Menyalin semua dari runner ke VM
            echo "Memulai rsync untuk frontend..."
            rsync -avz --delete \
              /home/runner/work/${{ github.repository_owner }}/${{ github.event.repository.name }}/frontend/ \
              ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }}:/var/www/hris-cmlabs/frontend/

            # Rsync untuk backend: Menyalin semua dari runner ke VM
            echo "Memulai rsync untuk backend..."
            rsync -avz --delete \
              /home/runner/work/${{ github.repository_owner }}/${{ github.event.repository.name }}/backend/ \
              ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }}:/var/www/hris-cmlabs/backend/

            echo "Rsync selesai. Melanjutkan dengan perintah pasca-deployment."

            # === BAGIAN BACKEND (LARAVEL) ===
            cd /var/www/hris-cmlabs/backend

            echo "Menginstal dependensi backend..."
            composer install --no-dev --optimize-autoloader

            echo "Menjalankan migrasi database..."
            php artisan migrate --force

            echo "Membersihkan cache backend..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # === BAGIAN FRONTEND (NEXT.JS) ===
            cd /var/www/hris-cmlabs/frontend

            echo "Memastikan aplikasi Next.js berjalan dengan PM2..."
            pm2 start npm --name hris-nextjs -- start
            pm2 save

            # === RESTART WEB SERVER ===
            echo "Me-restart Nginx..."
            sudo systemctl restart nginx
