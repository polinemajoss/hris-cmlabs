# .github/workflows/deploy.yml
name: Deploy ke Azure VM

on:
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Bersihkan Cache Build Frontend di Runner
        run: |
          rm -rf frontend/.next
          rm -rf frontend/out

      - name: Instal Dependensi Frontend dan Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload Frontend ke VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "frontend/"
          target: "/var/www/hris-cmlabs/frontend/"
          rm: true

      - name: Upload Backend ke VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "backend/"
          target: "/var/www/hris-cmlabs/backend/"
          rm: true

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - name: Jalankan Deployment di VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -x

            # Pastikan rsync terinstal di VM
            if ! command -v rsync &> /dev/null
            then
                echo "rsync tidak ditemukan, menginstal..."
                sudo apt update && sudo apt install -y rsync
            fi

            # Hentikan layanan yang mungkin mengunci file sebelum sinkronisasi
            echo "Menghentikan Nginx sebelum update..."
            sudo systemctl stop nginx || true
            echo "Menghentikan proses PM2 sebelum update..."
            pm2 stop all || true
            pm2 delete all || true
            pm2 save || true

            # Pastikan direktori target ada dan memiliki izin yang benar
            sudo mkdir -p /var/www/hris-cmlabs/frontend
            sudo mkdir -p /var/www/hris-cmlabs/backend/public
            sudo chown -R ${{ secrets.AZURE_VM_USER }}:www-data /var/www/hris-cmlabs/
            sudo chmod -R 775 /var/www/hris-cmlabs/

            # === BAGIAN BACKEND (LARAVEL) ===
            cd /var/www/hris-cmlabs/backend

            echo "Menginstal dependensi backend..."
            composer install --no-dev --optimize-autoloader

            echo "Menjalankan migrasi database..."
            php artisan migrate --force

            echo "Membersihkan cache backend..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # === BAGIAN FRONTEND (NEXT.JS) ===
            cd /var/www/hris-cmlabs/frontend

            echo "Memastikan aplikasi Next.js berjalan dengan PM2..."
            pm2 start npm --name hris-nextjs -- start
            pm2 save

            # === RESTART WEB SERVER ===
            echo "Me-restart Nginx..."
            sudo systemctl restart nginx
